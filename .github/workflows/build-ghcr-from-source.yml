name: Build And Push GHCR From Source

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag override"
        required: false
        type: string
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/build-ghcr-from-source.yml"
      - "server/**"
      - "webapp/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mattermost package from source
        run: |
          make -C server build package-linux-amd64

      - name: Prepare image tags
        id: vars
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mattermost"
          SHA_TAG="${GITHUB_SHA::12}"
          REF_TAG="${GITHUB_REF_NAME//\//-}"
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            PRIMARY_TAG="${INPUT_TAG}"
          else
            PRIMARY_TAG="${REF_TAG}"
          fi
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${SHA_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/build/Dockerfile.source-package
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.primary_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
